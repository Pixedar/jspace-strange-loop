<svg viewBox="0 0 660 310" role="img" aria-label="Selectable architecture blocks" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="660" height="310" fill="#f8f7f2"></rect><title>The c8 reference reader and the live language-model feedback route</title><desc>Wiktor Tomasik, 2026. A small reader selects recent internal activity, maintains a stance and learned selection maps, and writes selected native content back into frozen Qwen. The processed return influences its next reading. Recorded experiments omit the write-and-return route.</desc><style>text{font-family:Arial,sans-serif;fill:#23343a}.arch-node rect{fill:#eff5ef;stroke:#829f9e;stroke-width:1.5}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#557c80"></path></marker></defs><path d="M190 70 H232" fill="none" stroke="#557c80" stroke-width="1.7" marker-end="url(#arrow)"></path><path d="M405 70 H447" fill="none" stroke="#557c80" stroke-width="1.7" marker-end="url(#arrow)"></path><path d="M535 105 V192" fill="none" stroke="#557c80" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="545" y="155" font-size="12" fill="#435f64">turn</text><path d="M450 230 H407" fill="none" stroke="#557c80" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="415" y="217" font-size="12" fill="#435f64">query</text><path d="M320 195 V108" fill="none" stroke="#557c80" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="282" y="155" font-size="12" fill="#435f64">guide selection</text><path d="M235 82 C205 82 205 225 190 225" fill="none" stroke="#557c80" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="142" y="151" font-size="12" fill="#435f64">content</text><path d="M100 195 V108" fill="none" stroke="#557c80" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="20" y="151" font-size="12" fill="#435f64">next return</text><g role="button" class="arch-node" data-module="host" aria-label="Open Running Qwen"><rect x="20" y="35" width="170" height="70" rx="9"></rect><text x="105" y="75" text-anchor="middle" font-size="13">Running Qwen</text></g><g role="button" class="arch-node" data-module="selection" aria-label="Open Select recent content"><rect x="235" y="35" width="170" height="70" rx="9"></rect><text x="320" y="75" text-anchor="middle" font-size="13">Select recent content</text></g><g role="button" class="arch-node" data-module="picture" aria-label="Open Compact picture"><rect x="450" y="35" width="170" height="70" rx="9"></rect><text x="535" y="75" text-anchor="middle" font-size="13">Compact picture</text></g><g role="button" class="arch-node" data-module="stance" aria-label="Open Maintained stance"><rect x="450" y="195" width="170" height="70" rx="9"></rect><text x="535" y="235" text-anchor="middle" font-size="13">Maintained stance</text></g><g role="button" class="arch-node" data-module="learning" aria-label="Open Habit + forecast"><rect x="235" y="195" width="170" height="70" rx="9"></rect><text x="320" y="235" text-anchor="middle" font-size="13">Habit + forecast</text></g><g role="button" class="arch-node" data-module="writer" aria-label="Open Wide content writer"><rect x="20" y="195" width="170" height="70" rx="9"></rect><text x="105" y="235" text-anchor="middle" font-size="13">Wide content writer</text></g></svg>