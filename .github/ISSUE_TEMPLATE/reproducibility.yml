name: Reproducibility report
description: Report a mismatch, missing artifact or problem reproducing a result.
title: "[Reproduction]: "
body:
  - type: input
    id: version
    attributes:
      label: Source version and experiment
      description: Include the commit or version tag, configuration and run IDs where available.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command and which input artifacts you used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
      description: Describe the discrepancy and its effect on the research claim.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python and relevant package versions; hardware if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Include the smallest useful excerpt, with credentials removed.
      render: text
